# Harmonogram co 5 minut plus ręczne uruchomienie.
# Nie dodawaj tu zdarzenia "push": zapis stanu nie może odpalać bota od nowa.
# GitHub i tak często spóźnia cron. Stop-loss nie jest natychmiastowy.
# Odświeżenie rejestracji cron w GitHubie. Zegar zostaje bez zmian.

name: Solana Memecoin Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: solana-memecoin-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Biblioteki
        run: python -m pip install -r requirements.txt

      - name: Uruchom bota
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          # Publiczne repo: pętla około 4,5 min. Prywatne: jedno sprawdzenie.
          LOOP_SECONDS: ${{ github.event.repository.private == false && '270' || '0' }}
        run: python -u main.py

      - name: Zapisz stan
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json state/trades.csv state/ostatni_raport.md
          if git diff --cached --quiet; then
            echo "Stan bez zmian."
            exit 0
          fi
          git commit -m "Update trading state"
          branch=$(git rev-parse --abbrev-ref HEAD)
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$branch"; then
              if git push origin "HEAD:$branch"; then
                exit 0
              fi
            else
              python -m bot.merge_state
              git add state/state.json state/trades.csv state/ostatni_raport.md
              GIT_EDITOR=true git rebase --continue || true
              if git push origin "HEAD:$branch"; then
                exit 0
              fi
            fi
            echo "Zapis stanu nie wszedł, próba $attempt. Czekam i ponawiam."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Nie udało się zapisać stanu."
          exit 1
